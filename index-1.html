["श्वसन और दहन में एक महत्वपूर्ण अंतर यह है कि श्वसन—","नियंत्रित जैव-रासायनिक प्रक्रिया है","हमेशा आग के साथ होता है","केवल पौधों में होता है","ऊर्जा उत्पन्न नहीं करता",0],

const quiz=document.getElementById("quiz");
qs.forEach((q,i)=>{
 let d=document.createElement("div"); d.className="card";
 d.innerHTML=`<div class="q">${i+1}. ${q[0]}</div>`+
 q.slice(1,5).map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("")+
 `<div class="small" id="exp${i}"></div>`;
 quiz.appendChild(d);
});
let time=1800, done=false;
const timer=setInterval(()=>{if(done)return;time--;let m=Math.floor(time/60),s=time%60;document.getElementById("timer").textContent=`समय: ${m}:${String(s).padStart(2,"0")}`;if(time<=0){clearInterval(timer);submitQuiz();}},1000);

function submitQuiz(){
 if(done)return; done=true; clearInterval(timer);
 let score=0, answered=0;
 qs.forEach((q,i)=>{
  const sel=document.querySelector(`input[name="q${i}"]:checked`);
  if(sel) answered++;
  const card=quiz.children[i], labels=card.querySelectorAll("label");
  labels.forEach((l,j)=>{if(j===q[5])l.classList.add("correct"); if(sel&&+sel.value===j&&j!==q[5])l.classList.add("wrong");});
  if(sel&&+sel.value===q[5])score++;
 });
 const r=document.getElementById("result");r.style.display="block";
 r.innerHTML=`<h2>🎉 Test पूरा हुआ!</h2><p style="font-size:24px"><b>${score} / 50</b></p><p>सही उत्तर: ${score} &nbsp; | &nbsp; गलत: ${answered-score} &nbsp; | &nbsp; बिना उत्तर: ${50-answered}</p><p>${score>=40?"बहुत अच्छा प्रदर्शन!":score>=25?"अच्छा प्रयास, थोड़ी और Practice करें।":"अध्याय को दोबारा पढ़कर फिर से Practice करें।"}</p><button onclick="location.reload()">फिर से टेस्ट दें</button>`;
 r.scrollIntoView({behavior:"smooth"});
}
